
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# One ko job per kernel family, in parallel, each inside the image that family is built in.
# A separate uidbench job cross-compiles the one optional tool in this tree that wants the
# Android NDK. The pack job collects the ko files, cross-compiles the userspace half and the
# loader with the NDK and packs the module zip. Nothing is published from here: the zip is a
# run artifact and nothing is relayed, so a compiled module exists only where it was built.

permissions:
  contents: read

# Cancel superseded runs on the same ref so a force-push / rapid merge does not burn
# a full matrix of privileged containers. Tag pushes are excluded so release artifacts survive.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  ko:
    name: tosya.ko (${{ matrix.kmi }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.kmi }}-20260828
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kmi: android12-5.10, clang: clang-r416183b}
          - {kmi: android13-5.10, clang: clang-r450784e}
          - {kmi: android13-5.15, clang: clang-r450784e}
          - {kmi: android14-5.15, clang: clang-r487747c}
          - {kmi: android14-6.1,  clang: clang-r487747c}
          - {kmi: android15-6.6,  clang: clang-r510928}
          - {kmi: android16-6.12, clang: clang-r536225}
          - {kmi: android17-6.18, clang: clang-r584948c}
    # Job-level `env` only allows github/needs/strategy/matrix/vars/inputs contexts --
    # the `runner` context is NOT available here. Kbuild objects and the produced module
    # go under build/ (build/kmi/<KMI> and build/ko/<KMI>_arm64_tosya.ko), matching
    # scripts/build-kmi.sh as documented in build.md, so nothing depends on RUNNER_TEMP.
    env:
      KMI: ${{ matrix.kmi }}
      CLANG: ${{ matrix.clang }}
    steps:
      # Supply-chain hardening: pin third-party actions to a full commit SHA, not just a
      # tag (tags can be re-moved). Replace <sha> below with the resolved commit.
      - uses: actions/checkout@v7            # pin: actions/checkout@<sha>  # v7
        with:
          fetch-depth: 0
      - name: Check formatting
        # Inside the image on purpose: it carries the clang-format this repository is
        # written against, and a bare runner disagrees with it about the spacing written
        # inside braces.
        run: bash scripts/check-format.sh
      - name: Build
        run: |
          set -euo pipefail
          # build/kmi/<KMI> holds the symlinked sources and Kbuild objects;
          # build/ko/ collects the loadable module, exactly as scripts/build-kmi.sh is
          # documented to behave in build.md.
          TOSYA_KBUILD_JOBS="$(nproc)" bash scripts/build-kmi.sh \
            "$KMI" "$CLANG" \
            "build/kmi/$KMI" \
            "build/ko/${KMI}_arm64_tosya.ko"
          NM="/opt/ddk/clang/${CLANG}/bin/llvm-nm" \
            bash scripts/check-undefined.sh build/ko/*.ko
      - name: Upload ko
        # upload-artifact v7 runs on Node 24 (needs Actions Runner >= 2.327.1). v7 adds
        # `archive: false` for direct single-file upload, but that ignores `name`, so we
        # keep the default archive mode to preserve the per-matrix artifact name below.
        uses: actions/upload-artifact@v7.0.2  # pin: actions/upload-artifact@<sha>  # v7.0.2
        with:
          name: tosya-${{ matrix.kmi }}
          path: build/ko/*.ko
          if-no-files-found: error
          retention-days: 90

  uidbench:
    # Optional measurement tool. Not a package component and not a kernel module, so it
    # builds on the bare runner (which ships the Android NDK) instead of a privileged DDK
    # container. Cross-compiled to aarch64-android34 per build.md.
    name: uidbench (aarch64-android34)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7            # pin: actions/checkout@<sha>  # v7
      - name: Cross-compile uidbench
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:?Android NDK not found on runner}}"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang" \
            -O2 -static -o uidbench src/tools/uidbench.c
          file uidbench
      - name: Upload uidbench
        uses: actions/upload-artifact@v7.0.2  # pin: actions/upload-artifact@<sha>  # v7.0.2
        with:
          name: uidbench-aarch64-android34
          path: uidbench
          if-no-files-found: error
          retention-days: 90

  pack:
    # The package: every KMI's ko, the userspace half (sync-tool, built from src/tools) and
    # the loader (lkmloader, built from the external/lkmloader submodule), packed by the
    # module target with the ko files the matrix jobs produced.
    name: pack module zip
    runs-on: ubuntu-latest
    needs: ko
    steps:
      - uses: actions/checkout@v7            # pin: actions/checkout@<sha>  # v7
        with:
          fetch-depth: 0
          # lkmloader is built here, from external/lkmloader.
          submodules: recursive
      - uses: actions/download-artifact@v8
        with:
          path: build/ko
          pattern: tosya-*
          merge-multiple: true
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nlohmann-json3-dev
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          # Do not reuse a partially restored NDK archive; the local cache can
          # contain source.properties while missing the LLVM toolchain.
          local-cache: false
      - name: Validate NDK toolchain
        run: |
          set -euo pipefail
          ndk="${{ steps.ndk.outputs.ndk-path }}"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          test -f "$ndk/build/cmake/android.toolchain.cmake"
      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DTOSYA_NDK="${{ steps.ndk.outputs.ndk-path }}" \
            -DTOSYA_USE_PREBUILT_KO=ON
      - name: Build and pack
        run: |
          set -euo pipefail
          cmake --build build --target module -j"$(nproc)"
          ls -la build/dist
      - name: Upload module zip
        uses: actions/upload-artifact@v7.0.2  # pin: actions/upload-artifact@<sha>  # v7.0.2
        with:
          name: module-zip
          path: build/dist/*.zip
          if-no-files-found: error
          retention-days: 90
